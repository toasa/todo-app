services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html # フロントエンドのファイルをマウント
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    image: node:24-alpine
    working_dir: /app
    # ports:
    #   - "3000:3000"  <-- 削除！ アプリの3000番は外部に公開しない
    volumes:
      - ./:/app
    environment:
      - DB_HOST=db
      - DB_USER=myuser
      - DB_PASS=mypassword
      - DB_NAME=todo_db
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=todo_db
    ports:
      - "5432:5432" # ホストからDBを見れるよう公開

volumes:
  postgres_data:
